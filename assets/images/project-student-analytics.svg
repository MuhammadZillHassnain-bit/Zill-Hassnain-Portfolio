<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="50%" stop-color="#0d131f"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.06">
    <pattern id="grid_project_student_analytics_svg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="1"/>
    </pattern>
    <rect width="800" height="450" fill="url(#grid_project_student_analytics_svg)"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="100" cy="60" r="160" fill="#c084fc" opacity="0.08" filter="url(#glow)"/>
  <circle cx="700" cy="380" r="180" fill="#a855f7" opacity="0.06" filter="url(#glow)"/>

  <!-- Window Chrome Header -->
  <rect x="15" y="15" width="770" height="35" rx="8" fill="#0d1424" stroke="#1e293b"/>
  <circle cx="35" cy="32" r="5" fill="#ef4444"/>
  <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
  <circle cx="65" cy="32" r="5" fill="#10b981"/>
  
  <text x="400" y="36" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">Student Academic Performance Analysis</text>
  <rect x="670" y="22" width="100" height="20" rx="10" fill="rgba(56, 189, 248, 0.15)"/>
  <text x="720" y="35" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" font-family="monospace">ACTIVE</text>

  <!-- Render project-specific content -->
  
      <!-- Header -->
      <g transform="translate(30, 55)">
        <rect width="740" height="50" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="25" y="31" fill="#f8fafc" font-size="14" font-weight="700" font-family="sans-serif">Student Performance Predictive &amp; EDA Suite</text>
        <rect x="560" y="12" width="160" height="26" rx="6" fill="#1e293b"/>
        <text x="640" y="29" fill="#c084fc" font-size="11" font-weight="600" text-anchor="middle" font-family="monospace">N = 1,200 Students</text>
      </g>

      <!-- Visualization Grid -->
      <!-- Chart 1: Study Hours vs GPA Regression -->
      <g transform="translate(30, 120)">
        <rect width="360" height="300" rx="12" fill="#0f172a" stroke="#1e293b"/>
        <text x="20" y="28" fill="#94a3b8" font-size="11" font-weight="700" font-family="sans-serif">STUDY TIME VS GPA CORRELATION</text>
        
        <!-- Plot Box -->
        <rect x="30" y="45" width="300" height="200" fill="#090d16" stroke="#1e293b"/>
        <!-- Regression line -->
        <line x1="50" y1="210" x2="310" y2="65" stroke="#38bdf8" stroke-width="2.5"/>
        
        <!-- Data Dots -->
        <circle cx="65" cy="205" r="4" fill="#60a5fa" opacity="0.7"/>
        <circle cx="90" cy="190" r="4" fill="#60a5fa" opacity="0.7"/>
        <circle cx="120" cy="170" r="4" fill="#60a5fa" opacity="0.7"/>
        <circle cx="150" cy="140" r="4" fill="#60a5fa" opacity="0.7"/>
        <circle cx="180" cy="135" r="4" fill="#60a5fa" opacity="0.7"/>
        <circle cx="210" cy="115" r="4" fill="#60a5fa" opacity="0.7"/>
        <circle cx="240" cy="95" r="4" fill="#60a5fa" opacity="0.7"/>
        <circle cx="270" cy="85" r="4" fill="#60a5fa" opacity="0.7"/>
        <circle cx="295" cy="70" r="4" fill="#60a5fa" opacity="0.7"/>

        <!-- Stat callout -->
        <rect x="40" y="60" width="130" height="30" rx="6" fill="#131e33" stroke="rgba(56, 189, 248, 0.4)"/>
        <text x="105" y="80" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" font-family="monospace">Pearson r = +0.86</text>

        <text x="180" y="270" fill="#64748b" font-size="10" text-anchor="middle">Weekly Study Hours (0 to 35 hrs)</text>
      </g>

      <!-- Chart 2: Correlation Heatmap Matrix -->
      <g transform="translate(410, 120)">
        <rect width="360" height="300" rx="12" fill="#0f172a" stroke="#1e293b"/>
        <text x="20" y="28" fill="#94a3b8" font-size="11" font-weight="700" font-family="sans-serif">MULTIVARIATE CORRELATION HEATMAP</text>

        <g transform="translate(30, 45)">
          <!-- Heatmap Cells -->
          <!-- Row 1: Attendance -->
          <rect x="80" y="20" width="60" height="40" fill="#2563eb"/>
          <text x="110" y="45" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">1.00</text>
          
          <rect x="145" y="20" width="60" height="40" fill="#1d4ed8"/>
          <text x="175" y="45" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">0.78</text>

          <rect x="210" y="20" width="60" height="40" fill="#1e3a8a"/>
          <text x="240" y="45" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">0.82</text>

          <!-- Row 2: Study -->
          <rect x="80" y="65" width="60" height="40" fill="#1d4ed8"/>
          <text x="110" y="90" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">0.78</text>

          <rect x="145" y="65" width="60" height="40" fill="#2563eb"/>
          <text x="175" y="90" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">1.00</text>

          <rect x="210" y="65" width="60" height="40" fill="#3b82f6"/>
          <text x="240" y="90" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">0.86</text>

          <!-- Row 3: Final GPA -->
          <rect x="80" y="110" width="60" height="40" fill="#1e3a8a"/>
          <text x="110" y="135" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">0.82</text>

          <rect x="145" y="110" width="60" height="40" fill="#3b82f6"/>
          <text x="175" y="135" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">0.86</text>

          <rect x="210" y="110" width="60" height="40" fill="#2563eb"/>
          <text x="240" y="135" fill="#f8fafc" font-size="11" font-weight="700" text-anchor="middle">1.00</text>

          <!-- Labels -->
          <text x="70" y="45" fill="#94a3b8" font-size="10" text-anchor="end">Attend</text>
          <text x="70" y="90" fill="#94a3b8" font-size="10" text-anchor="end">Study</text>
          <text x="70" y="135" fill="#94a3b8" font-size="10" text-anchor="end">GPA</text>

          <text x="110" y="15" fill="#94a3b8" font-size="10" text-anchor="middle">Attend</text>
          <text x="175" y="15" fill="#94a3b8" font-size="10" text-anchor="middle">Study</text>
          <text x="240" y="15" fill="#94a3b8" font-size="10" text-anchor="middle">GPA</text>
        </g>

        <!-- Insights Pill -->
        <rect x="30" y="215" width="300" height="55" rx="8" fill="#131e33" stroke="#1e293b"/>
        <text x="45" y="238" fill="#f8fafc" font-size="11" font-weight="600">Key Analytical Finding:</text>
        <text x="45" y="255" fill="#a855f7" font-size="11">Study consistency &amp; attendance predict 89% of GPA variance</text>
      </g>
    

  <!-- Outer Glass Frame Stroke -->
  <rect x="15" y="15" width="770" height="420" rx="10" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
</svg>