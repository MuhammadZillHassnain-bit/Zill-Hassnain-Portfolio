<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="50%" stop-color="#0d131f"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.06">
    <pattern id="grid_project_portfolio_website_svg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="1"/>
    </pattern>
    <rect width="800" height="450" fill="url(#grid_project_portfolio_website_svg)"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="100" cy="60" r="160" fill="#00f2fe" opacity="0.08" filter="url(#glow)"/>
  <circle cx="700" cy="380" r="180" fill="#38bdf8" opacity="0.06" filter="url(#glow)"/>

  <!-- Window Chrome Header -->
  <rect x="15" y="15" width="770" height="35" rx="8" fill="#0d1424" stroke="#1e293b"/>
  <circle cx="35" cy="32" r="5" fill="#ef4444"/>
  <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
  <circle cx="65" cy="32" r="5" fill="#10b981"/>
  
  <text x="400" y="36" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">Personal Portfolio Web Experience</text>
  <rect x="670" y="22" width="100" height="20" rx="10" fill="rgba(56, 189, 248, 0.15)"/>
  <text x="720" y="35" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" font-family="monospace">ACTIVE</text>

  <!-- Render project-specific content -->
  
      <!-- Portfolio Hero Screen Simulation -->
      <g transform="translate(30, 55)">
        <rect width="740" height="365" rx="12" fill="#090d16" stroke="#1e293b"/>
        
        <!-- Glowing Grid Background Overlay -->
        <g opacity="0.15">
          <line x1="0" y1="50" x2="740" y2="50" stroke="#38bdf8"/>
          <line x1="0" y1="100" x2="740" y2="100" stroke="#38bdf8"/>
          <line x1="0" y1="150" x2="740" y2="150" stroke="#38bdf8"/>
          <line x1="0" y1="200" x2="740" y2="200" stroke="#38bdf8"/>
          <line x1="0" y1="250" x2="740" y2="250" stroke="#38bdf8"/>
          <line x1="0" y1="300" x2="740" y2="300" stroke="#38bdf8"/>
          <line x1="120" y1="0" x2="120" y2="365" stroke="#38bdf8"/>
          <line x1="240" y1="0" x2="240" y2="365" stroke="#38bdf8"/>
          <line x1="360" y1="0" x2="360" y2="365" stroke="#38bdf8"/>
          <line x1="480" y1="0" x2="480" y2="365" stroke="#38bdf8"/>
          <line x1="600" y1="0" x2="600" y2="365" stroke="#38bdf8"/>
        </g>

        <!-- Navbar Mockup -->
        <rect x="20" y="15" width="700" height="40" rx="8" fill="#0d1424" stroke="rgba(56, 189, 248, 0.2)"/>
        <text x="40" y="39" fill="#00f2fe" font-size="14" font-weight="900" font-family="'JetBrains Mono'">&lt;Zill /&gt;</text>
        <text x="350" y="38" fill="#94a3b8" font-size="11" font-family="sans-serif">About   •   Skills   •   Projects   •   Education   •   Contact</text>
        <rect x="610" y="23" width="95" height="24" rx="12" fill="url(#grad1)"/>
        <text x="657" y="39" fill="#040812" font-size="10" font-weight="800" text-anchor="middle">Resume</text>

        <!-- Hero Content Mockup -->
        <g transform="translate(40, 85)">
