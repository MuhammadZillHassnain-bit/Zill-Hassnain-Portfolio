          <rect x="145" y="175" width="120" height="36" rx="8" fill="#131e33" stroke="#1e293b"/>
          <text x="205" y="198" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Contact Me</text>
        </g>

        <!-- Right Terminal Mockup -->
        <g transform="translate(460, 85)">
          <rect width="250" height="230" rx="10" fill="#050811" stroke="rgba(56, 189, 248, 0.3)"/>
          <rect width="250" height="28" rx="10" fill="#0d1424"/>
          <circle cx="18" cy="14" r="4" fill="#ef4444"/>
          <circle cx="32" cy="14" r="4" fill="#f59e0b"/>
          <circle cx="46" cy="14" r="4" fill="#10b981"/>
          <text x="130" y="18" fill="#64748b" font-size="10" font-family="monospace" text-anchor="middle">zill@terminal:~</text>

          <text x="15" y="55" fill="#38bdf8" font-size="11" font-family="'JetBrains Mono'">$ whoami</text>
          <text x="15" y="75" fill="#f8fafc" font-size="11" font-family="'JetBrains Mono'">"Muhammad Zill Hassnain"</text>
          <text x="15" y="105" fill="#38bdf8" font-size="11" font-family="'JetBrains Mono'">$ stack.getExpertise()</text>
          <text x="15" y="125" fill="#10b981" font-size="10" font-family="'JetBrains Mono'">["React", "Node", "Flutter",</text>
          <text x="25" y="142" fill="#10b981" font-size="10" font-family="'JetBrains Mono'">"Python", "SQL", "OOP"]</text>
          <text x="15" y="175" fill="#38bdf8" font-size="11" font-family="'JetBrains Mono'">$ status</text>
          <text x="15" y="195" fill="#f59e0b" font-size="10" font-family="'JetBrains Mono'">"Ready to build the future ⚡"</text>
        </g>
      </g>
    

  <!-- Outer Glass Frame Stroke -->
  <rect x="15" y="15" width="770" height="420" rx="10" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
</svg>