          <circle cx="15" cy="12" r="4" fill="#00f2fe"/>
          <text x="28" y="16" fill="#38bdf8" font-size="10" font-weight="600">Available for Opportunities</text>

          <text x="0" y="65" fill="#f8fafc" font-size="28" font-weight="900" font-family="'Plus Jakarta Sans', sans-serif">Muhammad Zill Hassnain</text>
          
          <text x="0" y="95" fill="#38bdf8" font-size="15" font-weight="700" font-family="'JetBrains Mono'">Full-Stack Developer | Android | AI/ML</text>
          
          <text x="0" y="125" fill="#94a3b8" font-size="12" font-family="sans-serif">BS Software Engineering @ UOL • CGPA 3.87</text>
          <text x="0" y="145" fill="#94a3b8" font-size="12" font-family="sans-serif">Building high-performance user experiences &amp; scalable software systems.</text>

          <!-- Action Buttons -->
