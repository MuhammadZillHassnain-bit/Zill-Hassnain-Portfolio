        <rect x="20" y="15" width="450" height="36" rx="8" fill="#131e33" stroke="#1e293b"/>
        <circle cx="40" cy="33" r="6" stroke="#64748b" stroke-width="1.5" fill="none"/>
        <path d="M44 37 L50 43" stroke="#64748b" stroke-width="1.5"/>
        <text x="60" y="38" fill="#94a3b8" font-size="12" font-family="sans-serif">Search by ISBN, Book Title, Author or Category...</text>

        <rect x="490" y="15" width="110" height="36" rx="8" fill="#131e33" stroke="#1e293b"/>
        <text x="545" y="38" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle" font-family="sans-serif">Computer Sci ▼</text>

        <rect x="615" y="15" width="105" height="36" rx="8" fill="url(#grad1)"/>
        <text x="667" y="38" fill="#040812" font-size="12" font-weight="700" text-anchor="middle" font-family="sans-serif">+ Add Book</text>

        <!-- Table Header -->
        <rect x="20" y="65" width="700" height="30" rx="6" fill="#1e293b"/>
        <text x="40" y="85" fill="#94a3b8" font-size="11" font-weight="700" font-family="sans-serif">ISBN</text>
        <text x="160" y="85" fill="#94a3b8" font-size="11" font-weight="700" font-family="sans-serif">BOOK TITLE</text>
        <text x="380" y="85" fill="#94a3b8" font-size="11" font-weight="700" font-family="sans-serif">AUTHOR</text>
        <text x="520" y="85" fill="#94a3b8" font-size="11" font-weight="700" font-family="sans-serif">COPIES</text>
        <text x="620" y="85" fill="#94a3b8" font-size="11" font-weight="700" font-family="sans-serif">STATUS</text>

        <!-- Row 1 -->
        <text x="40" y="125" fill="#38bdf8" font-size="11" font-family="'JetBrains Mono', monospace">978-0132350884</text>
        <text x="160" y="125" fill="#f8fafc" font-size="12" font-weight="600" font-family="sans-serif">Clean Code: Agile Software</text>
        <text x="380" y="125" fill="#94a3b8" font-size="12" font-family="sans-serif">Robert C. Martin</text>
        <text x="530" y="125" fill="#f8fafc" font-size="12" font-family="'JetBrains Mono'">12 / 12</text>
        <rect x="615" y="110" width="85" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="657" y="125" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle" font-family="sans-serif">AVAILABLE</text>

        <!-- Row 2 -->
        <line x1="20" y1="145" x2="720" y2="145" stroke="#1e293b"/>
        <text x="40" y="175" fill="#38bdf8" font-size="11" font-family="'JetBrains Mono', monospace">978-0262033848</text>
        <text x="160" y="175" fill="#f8fafc" font-size="12" font-weight="600" font-family="sans-serif">Introduction to Algorithms (CLRS)</text>
        <text x="380" y="175" fill="#94a3b8" font-size="12" font-family="sans-serif">Thomas H. Cormen</text>
        <text x="530" y="175" fill="#f8fafc" font-size="12" font-family="'JetBrains Mono'">2 / 10</text>
        <rect x="615" y="160" width="85" height="22" rx="11" fill="rgba(245, 158, 11, 0.15)"/>
        <text x="657" y="175" fill="#f59e0b" font-size="10" font-weight="700" text-anchor="middle" font-family="sans-serif">LIMITED</text>

        <!-- Row 3 -->
        <line x1="20" y1="195" x2="720" y2="195" stroke="#1e293b"/>
        <text x="40" y="225" fill="#38bdf8" font-size="11" font-family="'JetBrains Mono', monospace">978-0134685991</text>
        <text x="160" y="225" fill="#f8fafc" font-size="12" font-weight="600" font-family="sans-serif">Effective Java (3rd Edition)</text>
        <text x="380" y="225" fill="#94a3b8" font-size="12" font-family="sans-serif">Joshua Bloch</text>
        <text x="530" y="225" fill="#f8fafc" font-size="12" font-family="'JetBrains Mono'">8 / 8</text>
        <rect x="615" y="210" width="85" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="657" y="225" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle" font-family="sans-serif">AVAILABLE</text>

        <!-- Row 4 -->
        <line x1="20" y1="245" x2="720" y2="245" stroke="#1e293b"/>
        <text x="40" y="263" fill="#38bdf8" font-size="11" font-family="'JetBrains Mono', monospace">978-0131103627</text>
        <text x="160" y="263" fill="#f8fafc" font-size="12" font-weight="600" font-family="sans-serif">The C Programming Language</text>
        <text x="380" y="263" fill="#94a3b8" font-size="12" font-family="sans-serif">Kernighan &amp; Ritchie</text>
        <text x="530" y="263" fill="#f8fafc" font-size="12" font-family="'JetBrains Mono'">0 / 6</text>
        <rect x="615" y="248" width="85" height="20" rx="10" fill="rgba(239, 68, 68, 0.15)"/>
        <text x="657" y="262" fill="#ef4444" font-size="10" font-weight="700" text-anchor="middle" font-family="sans-serif">BORROWED</text>
      </g>
    

  <!-- Outer Glass Frame Stroke -->
  <rect x="15" y="15" width="770" height="420" rx="10" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
</svg>