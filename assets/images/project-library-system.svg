<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="50%" stop-color="#0d131f"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.06">
    <pattern id="grid_project_library_system_svg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="1"/>
    </pattern>
    <rect width="800" height="450" fill="url(#grid_project_library_system_svg)"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="100" cy="60" r="160" fill="#60a5fa" opacity="0.08" filter="url(#glow)"/>
  <circle cx="700" cy="380" r="180" fill="#2563eb" opacity="0.06" filter="url(#glow)"/>

  <!-- Window Chrome Header -->
  <rect x="15" y="15" width="770" height="35" rx="8" fill="#0d1424" stroke="#1e293b"/>
  <circle cx="35" cy="32" r="5" fill="#ef4444"/>
  <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
  <circle cx="65" cy="32" r="5" fill="#10b981"/>
  
  <text x="400" y="36" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">Library Management System</text>
  <rect x="670" y="22" width="100" height="20" rx="10" fill="rgba(56, 189, 248, 0.15)"/>
  <text x="720" y="35" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" font-family="monospace">ACTIVE</text>

  <!-- Render project-specific content -->
  
      <!-- Dashboard Stats -->
      <g transform="translate(30, 55)">
        <rect width="175" height="75" rx="10" fill="#0f172a" stroke="#1e293b"/>
        <text x="20" y="28" fill="#94a3b8" font-size="11" font-family="sans-serif">TOTAL CATALOG</text>
        <text x="20" y="55" fill="#f8fafc" font-size="22" font-weight="800" font-family="'JetBrains Mono', monospace">14,820</text>
        <circle cx="145" cy="38" r="16" fill="rgba(56, 189, 248, 0.15)"/>
        <path d="M140 32 L150 32 M140 38 L150 38 M140 44 L146 44" stroke="#38bdf8" stroke-width="2"/>
      </g>

      <g transform="translate(220, 55)">
        <rect width="175" height="75" rx="10" fill="#0f172a" stroke="#1e293b"/>
        <text x="20" y="28" fill="#94a3b8" font-size="11" font-family="sans-serif">ACTIVE LOANS</text>
        <text x="20" y="55" fill="#38bdf8" font-size="22" font-weight="800" font-family="'JetBrains Mono', monospace">1,248</text>
        <circle cx="145" cy="38" r="16" fill="rgba(59, 130, 246, 0.15)"/>
        <path d="M145 30 L145 42 M145 42 L151 36" stroke="#60a5fa" stroke-width="2"/>
      </g>

      <g transform="translate(410, 55)">
        <rect width="175" height="75" rx="10" fill="#0f172a" stroke="#1e293b"/>
        <text x="20" y="28" fill="#94a3b8" font-size="11" font-family="sans-serif">REGISTERED MEMBERS</text>
        <text x="20" y="55" fill="#10b981" font-size="22" font-weight="800" font-family="'JetBrains Mono', monospace">3,890</text>
        <circle cx="145" cy="38" r="16" fill="rgba(16, 185, 129, 0.15)"/>
        <circle cx="145" cy="35" r="5" stroke="#10b981" stroke-width="2" fill="none"/>
        <path d="M138 46 C138 42 142 41 145 41 C148 41 152 42 152 46" stroke="#10b981" stroke-width="2" fill="none"/>
      </g>

      <g transform="translate(600, 55)">
        <rect width="170" height="75" rx="10" fill="#0f172a" stroke="#1e293b"/>
        <text x="20" y="28" fill="#94a3b8" font-size="11" font-family="sans-serif">OVERDUE ALERTS</text>
        <text x="20" y="55" fill="#f59e0b" font-size="22" font-weight="800" font-family="'JetBrains Mono', monospace">18</text>
        <circle cx="140" cy="38" r="16" fill="rgba(245, 158, 11, 0.15)"/>
        <text x="140" y="44" fill="#f59e0b" font-size="14" font-weight="900" text-anchor="middle">!</text>
      </g>

      <!-- Main Records Table -->
      <g transform="translate(30, 145)">
        <rect width="740" height="275" rx="12" fill="#0f172a" stroke="#1e293b"/>
