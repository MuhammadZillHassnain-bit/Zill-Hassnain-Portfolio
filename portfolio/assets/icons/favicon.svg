<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="favGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#080b11"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#favGrad)" stroke-width="2.5" opacity="0.6"/>
  <text x="50" y="62" fill="url(#favGrad)" font-size="34" font-weight="900" font-family="'JetBrains Mono', 'Fira Code', monospace" text-anchor="middle" filter="url(#favGlow)">ZH</text>
  <circle cx="80" cy="22" r="4" fill="#00f2fe"/>
</svg>
