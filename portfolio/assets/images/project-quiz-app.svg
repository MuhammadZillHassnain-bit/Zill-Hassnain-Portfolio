<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="50%" stop-color="#0d131f"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.06">
    <pattern id="grid_project_quiz_app_svg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="1"/>
    </pattern>
    <rect width="800" height="450" fill="url(#grid_project_quiz_app_svg)"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="100" cy="60" r="160" fill="#10b981" opacity="0.08" filter="url(#glow)"/>
  <circle cx="700" cy="380" r="180" fill="#10b981" opacity="0.06" filter="url(#glow)"/>

  <!-- Window Chrome Header -->
  <rect x="15" y="15" width="770" height="35" rx="8" fill="#0d1424" stroke="#1e293b"/>
  <circle cx="35" cy="32" r="5" fill="#ef4444"/>
  <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
  <circle cx="65" cy="32" r="5" fill="#10b981"/>
  
  <text x="400" y="36" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">Interactive Quiz Platform</text>
  <rect x="670" y="22" width="100" height="20" rx="10" fill="rgba(56, 189, 248, 0.15)"/>
  <text x="720" y="35" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" font-family="monospace">ACTIVE</text>

  <!-- Render project-specific content -->
  
      <!-- Quiz Header Card -->
      <g transform="translate(30, 55)">
        <rect width="740" height="60" rx="10" fill="#0f172a" stroke="#1e293b"/>
        <text x="25" y="36" fill="#f8fafc" font-size="15" font-weight="700" font-family="sans-serif">Computer Science Mastery Sprint</text>
        <rect x="300" y="18" width="130" height="24" rx="12" fill="#1e293b"/>
        <text x="365" y="34" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle" font-family="sans-serif">Question 7 of 15</text>

        <!-- Circular Timer Ring -->
        <g transform="translate(680, 30)">
          <circle r="22" fill="#131e33" stroke="#1e293b" stroke-width="4"/>
          <circle r="22" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="138" stroke-dashoffset="35"/>
          <text y="5" fill="#f8fafc" font-size="11" font-weight="800" text-anchor="middle" font-family="'JetBrains Mono'">24s</text>
        </g>
      </g>

      <!-- Question Box -->
      <g transform="translate(30, 130)">
        <rect width="740" height="290" rx="12" fill="#0f172a" stroke="#1e293b"/>
        
        <!-- Score Bar -->
        <rect x="25" y="20" width="690" height="8" rx="4" fill="#1e293b"/>
        <rect x="25" y="20" width="320" height="8" rx="4" fill="url(#grad1)"/>

        <!-- Question Text -->
        <text x="25" y="60" fill="#94a3b8" font-size="12" font-weight="600" font-family="sans-serif">TOPIC: DATA STRUCTURES &amp; ALGORITHMS</text>
        <text x="25" y="90" fill="#f8fafc" font-size="16" font-weight="700" font-family="sans-serif">Which data structure operates on a First-In-First-Out (FIFO) principle?</text>

        <!-- Options Grid -->
        <!-- Option A -->
        <g transform="translate(25, 120)">
          <rect width="335" height="55" rx="8" fill="#131e33" stroke="#1e293b"/>
          <circle cx="30" cy="27" r="14" fill="#1e293b"/>
          <text x="30" y="32" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">A</text>
          <text x="60" y="32" fill="#f8fafc" font-size="13" font-family="sans-serif">Stack (LIFO)</text>
        </g>

        <!-- Option B (Correct Selected) -->
        <g transform="translate(380, 120)">
          <rect width="335" height="55" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
          <circle cx="30" cy="27" r="14" fill="#10b981"/>
          <text x="30" y="32" fill="#040812" font-size="11" font-weight="800" text-anchor="middle" font-family="sans-serif">✓</text>
          <text x="60" y="32" fill="#f8fafc" font-size="13" font-weight="600" font-family="sans-serif">Queue (FIFO)</text>
          <rect x="240" y="17" width="80" height="20" rx="10" fill="#10b981"/>
          <text x="280" y="31" fill="#040812" font-size="10" font-weight="800" text-anchor="middle" font-family="sans-serif">CORRECT</text>
        </g>

        <!-- Option C -->
        <g transform="translate(25, 190)">
          <rect width="335" height="55" rx="8" fill="#131e33" stroke="#1e293b"/>
          <circle cx="30" cy="27" r="14" fill="#1e293b"/>
          <text x="30" y="32" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">C</text>
          <text x="60" y="32" fill="#f8fafc" font-size="13" font-family="sans-serif">Binary Search Tree</text>
        </g>

        <!-- Option D -->
        <g transform="translate(380, 190)">
          <rect width="335" height="55" rx="8" fill="#131e33" stroke="#1e293b"/>
          <circle cx="30" cy="27" r="14" fill="#1e293b"/>
          <text x="30" y="32" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">D</text>
          <text x="60" y="32" fill="#f8fafc" font-size="13" font-family="sans-serif">Priority Heap</text>
        </g>

        <!-- Navigation Buttons -->
        <g transform="translate(25, 255)">
          <text x="0" y="20" fill="#10b981" font-size="12" font-weight="600" font-family="sans-serif">Streak: 🔥 5 in a row</text>
          <rect x="575" y="0" width="140" height="32" rx="8" fill="url(#grad1)"/>
          <text x="645" y="21" fill="#040812" font-size="12" font-weight="700" text-anchor="middle" font-family="sans-serif">Next Question →</text>
        </g>
      </g>
    

  <!-- Outer Glass Frame Stroke -->
  <rect x="15" y="15" width="770" height="420" rx="10" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
</svg>