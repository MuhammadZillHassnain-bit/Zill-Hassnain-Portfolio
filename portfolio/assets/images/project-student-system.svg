<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="50%" stop-color="#0d131f"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.06">
    <pattern id="grid_project_student_system_svg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="1"/>
    </pattern>
    <rect width="800" height="450" fill="url(#grid_project_student_system_svg)"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="100" cy="60" r="160" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="700" cy="380" r="180" fill="#38bdf8" opacity="0.06" filter="url(#glow)"/>

  <!-- Window Chrome Header -->
  <rect x="15" y="15" width="770" height="35" rx="8" fill="#0d1424" stroke="#1e293b"/>
  <circle cx="35" cy="32" r="5" fill="#ef4444"/>
  <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
  <circle cx="65" cy="32" r="5" fill="#10b981"/>
  
  <text x="400" y="36" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">Student Management System</text>
  <rect x="670" y="22" width="100" height="20" rx="10" fill="rgba(56, 189, 248, 0.15)"/>
  <text x="720" y="35" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" font-family="monospace">ACTIVE</text>

  <!-- Render project-specific content -->
  
      <!-- Toolbar -->
      <g transform="translate(30, 55)">
        <rect width="740" height="50" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="25" y="31" fill="#f8fafc" font-size="14" font-weight="700" font-family="sans-serif">Student Information &amp; Attendance Portal</text>
        <rect x="440" y="12" width="160" height="26" rx="6" fill="#131e33" stroke="#1e293b"/>
        <text x="520" y="29" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">🔍 Filter by Batch / Sec</text>
        <rect x="615" y="12" width="105" height="26" rx="6" fill="url(#grad1)"/>
        <text x="667" y="29" fill="#040812" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">Export Report</text>
      </g>

      <!-- Student Cards Grid -->
      <g transform="translate(30, 120)">
        <!-- Card 1 -->
        <g transform="translate(0, 0)">
          <rect width="230" height="135" rx="10" fill="#0f172a" stroke="#1e293b"/>
          <circle cx="35" cy="35" r="16" fill="rgba(56, 189, 248, 0.2)"/>
          <text x="35" y="40" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">01</text>
          <text x="65" y="32" fill="#f8fafc" font-size="12" font-weight="700">Hamza Tariq</text>
          <text x="65" y="47" fill="#64748b" font-size="10">BSSE - Sec A</text>
          <text x="20" y="80" fill="#94a3b8" font-size="10">ATTENDANCE</text>
          <text x="200" y="80" fill="#10b981" font-size="10" font-weight="700" text-anchor="end">94%</text>
          <rect x="20" y="88" width="190" height="4" rx="2" fill="#1e293b"/>
          <rect x="20" y="88" width="178" height="4" rx="2" fill="#10b981"/>
          <rect x="20" y="102" width="90" height="20" rx="4" fill="#131e33"/>
          <text x="65" y="116" fill="#38bdf8" font-size="10" text-anchor="middle">GPA: 3.75</text>
        </g>

        <!-- Card 2 (Featured Zill) -->
        <g transform="translate(255, 0)">
          <rect width="230" height="135" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
          <circle cx="35" cy="35" r="16" fill="url(#grad1)"/>
          <text x="35" y="40" fill="#040812" font-size="11" font-weight="900" text-anchor="middle">CR</text>
          <text x="65" y="32" fill="#f8fafc" font-size="12" font-weight="700">M. Zill Hassnain</text>
          <text x="65" y="47" fill="#38bdf8" font-size="10">BSSE - Class Topper</text>
          <text x="20" y="80" fill="#94a3b8" font-size="10">ATTENDANCE</text>
          <text x="200" y="80" fill="#10b981" font-size="10" font-weight="700" text-anchor="end">99%</text>
          <rect x="20" y="88" width="190" height="4" rx="2" fill="#1e293b"/>
          <rect x="20" y="88" width="188" height="4" rx="2" fill="#10b981"/>
          <rect x="20" y="102" width="90" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
          <text x="65" y="116" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">GPA: 3.87</text>
        </g>

        <!-- Card 3 -->
        <g transform="translate(510, 0)">
          <rect width="230" height="135" rx="10" fill="#0f172a" stroke="#1e293b"/>
          <circle cx="35" cy="35" r="16" fill="rgba(168, 85, 247, 0.2)"/>
          <text x="35" y="40" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">03</text>
          <text x="65" y="32" fill="#f8fafc" font-size="12" font-weight="700">Usman Ali</text>
          <text x="65" y="47" fill="#64748b" font-size="10">BSSE - Sec A</text>
          <text x="20" y="80" fill="#94a3b8" font-size="10">ATTENDANCE</text>
          <text x="200" y="80" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="end">88%</text>
          <rect x="20" y="88" width="190" height="4" rx="2" fill="#1e293b"/>
          <rect x="20" y="88" width="167" height="4" rx="2" fill="#38bdf8"/>
          <rect x="20" y="102" width="90" height="20" rx="4" fill="#131e33"/>
          <text x="65" y="116" fill="#38bdf8" font-size="10" text-anchor="middle">GPA: 3.60</text>
        </g>

        <!-- Analytics Overview Lower Bar -->
        <g transform="translate(0, 155)">
          <rect width="740" height="145" rx="10" fill="#0f172a" stroke="#1e293b"/>
          <text x="25" y="25" fill="#94a3b8" font-size="11" font-weight="700">SEMESTER PERFORMANCE DISTRIBUTION</text>
          
          <!-- Bar Graph Simulation -->
          <g transform="translate(25, 45)">
            <rect x="20" y="50" width="40" height="35" rx="4" fill="#334155"/>
            <text x="40" y="100" fill="#64748b" font-size="10" text-anchor="middle">&lt; 3.0</text>

            <rect x="100" y="30" width="40" height="55" rx="4" fill="#1e3a8a"/>
            <text x="120" y="100" fill="#64748b" font-size="10" text-anchor="middle">3.0 - 3.4</text>

            <rect x="180" y="15" width="40" height="70" rx="4" fill="#0284c7"/>
            <text x="200" y="100" fill="#64748b" font-size="10" text-anchor="middle">3.5 - 3.7</text>

            <rect x="260" y="5" width="40" height="80" rx="4" fill="url(#grad1)"/>
            <text x="280" y="100" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">3.8 - 4.0</text>
          </g>

          <g transform="translate(420, 45)">
            <rect width="290" height="75" rx="8" fill="#131e33" stroke="#1e293b"/>
            <text x="20" y="25" fill="#f8fafc" font-size="12" font-weight="600">Database Engine Stats</text>
            <text x="20" y="45" fill="#64748b" font-size="11">SQL Server 2022 • ACID Compliant</text>
            <text x="20" y="60" fill="#10b981" font-size="11">0.04s query execution avg</text>
          </g>
        </g>
      </g>
    

  <!-- Outer Glass Frame Stroke -->
  <rect x="15" y="15" width="770" height="420" rx="10" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
</svg>