<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="50%" stop-color="#0d131f"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.06">
    <pattern id="grid_project_pdf_generator_svg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="1"/>
    </pattern>
    <rect width="800" height="450" fill="url(#grid_project_pdf_generator_svg)"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="100" cy="60" r="160" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="700" cy="380" r="180" fill="#4facfe" opacity="0.06" filter="url(#glow)"/>

  <!-- Window Chrome Header -->
  <rect x="15" y="15" width="770" height="35" rx="8" fill="#0d1424" stroke="#1e293b"/>
  <circle cx="35" cy="32" r="5" fill="#ef4444"/>
  <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
  <circle cx="65" cy="32" r="5" fill="#10b981"/>
  
  <text x="400" y="36" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">I Love PDF - Web Application</text>
  <rect x="670" y="22" width="100" height="20" rx="10" fill="rgba(56, 189, 248, 0.15)"/>
  <text x="720" y="35" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" font-family="monospace">ACTIVE</text>

  <!-- Render project-specific content -->
  
      <!-- App Header -->
      <rect x="30" y="55" width="740" height="45" rx="8" fill="#131c2e" stroke="#1e293b"/>
      <circle cx="55" cy="77" r="14" fill="url(#grad1)"/>
      <path d="M50 72 L60 72 M50 77 L57 77 M50 82 L55 82" stroke="#040812" stroke-width="2" stroke-linecap="round"/>
      <text x="80" y="82" fill="#f8fafc" font-size="14" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif">PDF Workspace Studio</text>
      <rect x="620" y="65" width="130" height="26" rx="13" fill="#0284c7" opacity="0.2"/>
      <text x="685" y="82" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle" font-family="monospace">FAST ENGINE v2.4</text>

      <!-- Main Layout -->
      <!-- Left Column: Tool Grid -->
      <g transform="translate(30, 115)">
        <rect x="0" y="0" width="460" height="305" rx="12" fill="#0f172a" stroke="#1e293b"/>
        <text x="20" y="30" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="start" font-family="sans-serif">CORE PDF PROCESSING MODULES</text>
        
        <!-- Tool 1: Merge -->
        <g transform="translate(20, 45)">
          <rect width="200" height="110" rx="10" fill="#131e33" stroke="rgba(56, 189, 248, 0.3)"/>
          <circle cx="35" cy="35" r="16" fill="rgba(56, 189, 248, 0.15)"/>
          <path d="M30 35 L40 35 M35 30 L35 40" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
          <text x="60" y="33" fill="#f8fafc" font-size="13" font-weight="700" font-family="sans-serif">Merge PDF</text>
          <text x="60" y="48" fill="#64748b" font-size="10" font-family="sans-serif">Combine multiple docs</text>
          <rect x="20" y="70" width="160" height="24" rx="6" fill="#1e293b"/>
          <text x="100" y="86" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle" font-family="sans-serif">Batch Mode Ready</text>
        </g>

        <!-- Tool 2: Compress -->
        <g transform="translate(240, 45)">
          <rect width="200" height="110" rx="10" fill="#131e33" stroke="rgba(16, 185, 129, 0.3)"/>
          <circle cx="35" cy="35" r="16" fill="rgba(16, 185, 129, 0.15)"/>
          <path d="M30 30 L40 40 M30 40 L40 30" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
          <text x="60" y="33" fill="#f8fafc" font-size="13" font-weight="700" font-family="sans-serif">Compress PDF</text>
          <text x="60" y="48" fill="#64748b" font-size="10" font-family="sans-serif">Reduce size up to 85%</text>
          <rect x="20" y="70" width="160" height="24" rx="6" fill="#1e293b"/>
          <text x="100" y="86" fill="#10b981" font-size="10" font-weight="600" text-anchor="middle" font-family="sans-serif">Lossless Mode</text>
        </g>

        <!-- Tool 3: Split -->
        <g transform="translate(20, 175)">
          <rect width="200" height="110" rx="10" fill="#131e33" stroke="rgba(245, 158, 11, 0.3)"/>
          <circle cx="35" cy="35" r="16" fill="rgba(245, 158, 11, 0.15)"/>
          <text x="60" y="33" fill="#f8fafc" font-size="13" font-weight="700" font-family="sans-serif">Split &amp; Extract</text>
          <text x="60" y="48" fill="#64748b" font-size="10" font-family="sans-serif">Extract custom pages</text>
          <rect x="20" y="70" width="160" height="24" rx="6" fill="#1e293b"/>
          <text x="100" y="86" fill="#f59e0b" font-size="10" font-weight="600" text-anchor="middle" font-family="sans-serif">Range Selector</text>
        </g>

        <!-- Tool 4: Convert -->
        <g transform="translate(240, 175)">
          <rect width="200" height="110" rx="10" fill="#131e33" stroke="rgba(168, 85, 247, 0.3)"/>
          <circle cx="35" cy="35" r="16" fill="rgba(168, 85, 247, 0.15)"/>
          <text x="60" y="33" fill="#f8fafc" font-size="13" font-weight="700" font-family="sans-serif">PDF to Word / IMG</text>
          <text x="60" y="48" fill="#64748b" font-size="10" font-family="sans-serif">High fidelity parser</text>
          <rect x="20" y="70" width="160" height="24" rx="6" fill="#1e293b"/>
          <text x="100" y="86" fill="#c084fc" font-size="10" font-weight="600" text-anchor="middle" font-family="sans-serif">OCR Compatible</text>
        </g>
      </g>

      <!-- Right Column: Interactive Dropzone -->
      <g transform="translate(510, 115)">
        <rect width="260" height="305" rx="12" fill="#0f172a" stroke="#1e293b"/>
        <!-- Dropzone Box -->
        <rect x="20" y="20" width="220" height="180" rx="10" fill="#080e1a" stroke="#38bdf8" stroke-dasharray="6,4" stroke-width="1.5"/>
        <circle cx="130" cy="80" r="28" fill="rgba(56, 189, 248, 0.1)"/>
        <path d="M130 65 L130 95 M120 75 L130 65 L140 75" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="130" y="125" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle" font-family="sans-serif">Drop PDF documents here</text>
        <text x="130" y="145" fill="#64748b" font-size="11" text-anchor="middle" font-family="sans-serif">or browse local files</text>

        <!-- Processing Queue -->
        <rect x="20" y="215" width="220" height="70" rx="8" fill="#131e33" stroke="#1e293b"/>
        <text x="35" y="235" fill="#f8fafc" font-size="11" font-weight="600" font-family="sans-serif">Software_Engineering_Doc.pdf</text>
        <text x="35" y="250" fill="#64748b" font-size="10" font-family="sans-serif">2.4 MB • 98% processed</text>
        <rect x="35" y="260" width="190" height="6" rx="3" fill="#1e293b"/>
        <rect x="35" y="260" width="170" height="6" rx="3" fill="url(#grad1)"/>
      </g>
    

  <!-- Outer Glass Frame Stroke -->
  <rect x="15" y="15" width="770" height="420" rx="10" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
</svg>