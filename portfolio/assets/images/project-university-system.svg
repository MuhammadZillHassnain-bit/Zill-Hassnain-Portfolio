<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="50%" stop-color="#0d131f"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.06">
    <pattern id="grid_project_university_system_svg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="1"/>
    </pattern>
    <rect width="800" height="450" fill="url(#grid_project_university_system_svg)"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="100" cy="60" r="160" fill="#818cf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="700" cy="380" r="180" fill="#6366f1" opacity="0.06" filter="url(#glow)"/>

  <!-- Window Chrome Header -->
  <rect x="15" y="15" width="770" height="35" rx="8" fill="#0d1424" stroke="#1e293b"/>
  <circle cx="35" cy="32" r="5" fill="#ef4444"/>
  <circle cx="50" cy="32" r="5" fill="#f59e0b"/>
  <circle cx="65" cy="32" r="5" fill="#10b981"/>
  
  <text x="400" y="36" fill="#94a3b8" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle">University Management System</text>
  <rect x="670" y="22" width="100" height="20" rx="10" fill="rgba(56, 189, 248, 0.15)"/>
  <text x="720" y="35" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" font-family="monospace">ACTIVE</text>

  <!-- Render project-specific content -->
  
      <!-- Top Campus Bar -->
      <g transform="translate(30, 55)">
        <rect width="740" height="50" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <text x="25" y="31" fill="#f8fafc" font-size="14" font-weight="700" font-family="sans-serif">University of Lahore - Sargodha Campus ERP</text>
        <rect x="580" y="12" width="140" height="26" rx="6" fill="#1e293b"/>
        <text x="650" y="29" fill="#818cf8" font-size="11" font-weight="600" text-anchor="middle" font-family="sans-serif">Semester 7 Active</text>
      </g>

      <!-- Content Split -->
      <!-- Left: Academic Metrics & Course Grid -->
      <g transform="translate(30, 120)">
        <rect width="470" height="300" rx="12" fill="#0f172a" stroke="#1e293b"/>
        <text x="25" y="30" fill="#94a3b8" font-size="12" font-weight="700" font-family="sans-serif">REGISTERED COURSES - BS SOFTWARE ENGINEERING</text>

        <!-- Course 1 -->
        <g transform="translate(25, 50)">
          <rect width="420" height="48" rx="8" fill="#131e33" stroke="#1e293b"/>
          <rect x="15" y="12" width="60" height="24" rx="4" fill="rgba(99, 102, 241, 0.2)"/>
          <text x="45" y="28" fill="#818cf8" font-size="10" font-weight="700" text-anchor="middle" font-family="monospace">SE-310</text>
          <text x="90" y="29" fill="#f8fafc" font-size="12" font-weight="600" font-family="sans-serif">Software Quality Assurance</text>
          <text x="360" y="29" fill="#10b981" font-size="11" font-weight="700" font-family="'JetBrains Mono'">3.0 Cr (A)</text>
        </g>

        <!-- Course 2 -->
        <g transform="translate(25, 110)">
          <rect width="420" height="48" rx="8" fill="#131e33" stroke="#1e293b"/>
          <rect x="15" y="12" width="60" height="24" rx="4" fill="rgba(56, 189, 248, 0.2)"/>
          <text x="45" y="28" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" font-family="monospace">CS-322</text>
          <text x="90" y="29" fill="#f8fafc" font-size="12" font-weight="600" font-family="sans-serif">Artificial Intelligence &amp; ML</text>
          <text x="360" y="29" fill="#10b981" font-size="11" font-weight="700" font-family="'JetBrains Mono'">3.0 Cr (A+)</text>
        </g>

        <!-- Course 3 -->
        <g transform="translate(25, 170)">
          <rect width="420" height="48" rx="8" fill="#131e33" stroke="#1e293b"/>
          <rect x="15" y="12" width="60" height="24" rx="4" fill="rgba(245, 158, 11, 0.2)"/>
          <text x="45" y="28" fill="#f59e0b" font-size="10" font-weight="700" text-anchor="middle" font-family="monospace">SE-325</text>
          <text x="90" y="29" fill="#f8fafc" font-size="12" font-weight="600" font-family="sans-serif">Mobile Application Development</text>
          <text x="360" y="29" fill="#10b981" font-size="11" font-weight="700" font-family="'JetBrains Mono'">3.0 Cr (A)</text>
        </g>

        <!-- Course 4 -->
        <g transform="translate(25, 230)">
          <rect width="420" height="48" rx="8" fill="#131e33" stroke="#1e293b"/>
          <rect x="15" y="12" width="60" height="24" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
          <text x="45" y="28" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle" font-family="monospace">CS-315</text>
          <text x="90" y="29" fill="#f8fafc" font-size="12" font-weight="600" font-family="sans-serif">Database Systems Administration</text>
          <text x="360" y="29" fill="#10b981" font-size="11" font-weight="700" font-family="'JetBrains Mono'">4.0 Cr (A+)</text>
        </g>
      </g>

      <!-- Right: Student Academic Summary -->
      <g transform="translate(520, 120)">
        <rect width="250" height="300" rx="12" fill="#0f172a" stroke="#1e293b"/>
        
        <text x="25" y="30" fill="#94a3b8" font-size="11" font-weight="700" font-family="sans-serif">STUDENT RECORD</text>
        <circle cx="50" cy="70" r="22" fill="#1e293b" stroke="#38bdf8"/>
        <text x="50" y="75" fill="#38bdf8" font-size="14" font-weight="800" text-anchor="middle" font-family="sans-serif">ZH</text>
        <text x="85" y="65" fill="#f8fafc" font-size="13" font-weight="700" font-family="sans-serif">M. Zill Hassnain</text>
        <text x="85" y="82" fill="#64748b" font-size="10" font-family="monospace">Reg: 2023-BSSE-042</text>

        <!-- CGPA Pill -->
        <rect x="25" y="110" width="200" height="65" rx="8" fill="#131e33" stroke="#10b981" stroke-width="1"/>
        <text x="40" y="133" fill="#94a3b8" font-size="10" font-family="sans-serif">CUMULATIVE GPA</text>
        <text x="40" y="160" fill="#10b981" font-size="24" font-weight="800" font-family="'JetBrains Mono'">3.87</text>
        <rect x="135" y="130" width="80" height="24" rx="12" fill="rgba(16, 185, 129, 0.2)"/>
        <text x="175" y="146" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle" font-family="sans-serif">GRADE A+</text>

        <!-- Badges -->
        <g transform="translate(25, 195)">
          <rect width="200" height="36" rx="6" fill="#1e293b"/>
          <text x="15" y="23" fill="#f8fafc" font-size="11" font-weight="600" font-family="sans-serif">🏆 Class Position Holder</text>
        </g>
        <g transform="translate(25, 240)">
          <rect width="200" height="36" rx="6" fill="#1e293b"/>
          <text x="15" y="23" fill="#38bdf8" font-size="11" font-weight="600" font-family="sans-serif">👔 Class Representative</text>
        </g>
      </g>
    

  <!-- Outer Glass Frame Stroke -->
  <rect x="15" y="15" width="770" height="420" rx="10" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>
</svg>